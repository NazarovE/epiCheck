plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    //id 'com.google.gms.google-services' version '4.4.2' apply false
}

android {
    namespace 'com.example.appfond'
    compileSdk 36


    defaultConfig {

        applicationId "com.epicheck.main"
        minSdk 23
        //noinspection OldTargetApi,OldTargetApi,EditedTargetSdkVersion
        targetSdk 36
        versionCode 38
        versionName "3.8"
        //ndkVersion "29.0.14033849 rc1"
       //testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"


    }



    buildTypes {
        release {
            // Enables code-related app optimization.
            minifyEnabled true

            // Enables resource shrinking.
            shrinkResources true

            // Default file with automatically generated optimization rules.
           // proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }


    bundle {
            storeArchive {
                enable = false
            }
        }
    buildFeatures {
        viewBinding true
        buildConfig false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}





dependencies {

    //implementation 'com.github.User:Repo:Tag'

    implementation(platform("org.jetbrains.kotlin:kotlin-bom:1.8.22"))
    implementation 'com.github.dhaval2404:imagepicker:2.1'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'com.github.bumptech.glide:glide:5.0.5'
    implementation 'com.google.firebase:firebase-messaging:25.0.1'
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'androidx.navigation:navigation-fragment:2.9.6'
    implementation 'androidx.navigation:navigation-ui:2.9.6'
    implementation 'androidx.activity:activity:1.12.2'
    implementation 'com.google.android.datatransport:transport-api:4.0.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:5.0.5'
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'

    implementation 'com.squareup.picasso:picasso:2.71828'
    implementation 'com.android.volley:volley:1.2.1'
